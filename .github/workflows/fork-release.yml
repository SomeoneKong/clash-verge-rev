name: Fork Release
# Builds and publishes the custom fork. Upstream workflows stay untouched to keep
# rebases clean and are disabled in the repository settings instead.
on:
  push:
    tags:
      - 'v*-custom.*'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # rpm takes no '-' in a version, which the custom versions have
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: --bundles deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Toolchain and Node versions follow upstream release.yml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}

      # No Rust cache: a cache saved by a tag run is only visible to that tag.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Prepare sources
        shell: bash
        run: |
          pnpm i
          pnpm release-version "${GITHUB_REF_NAME}"
          pnpm run prebuild ${{ matrix.target }}

      # Without the upstream keys: no updater artifacts, and an ad-hoc signature
      # so the macOS bundle is sealed.
      - name: Build
        shell: bash
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}' > "${RUNNER_TEMP}/fork.conf.json"
          pnpm tauri build --target ${{ matrix.target }} --config "${RUNNER_TEMP}/fork.conf.json" ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          BASE="${GITHUB_REF_NAME%-custom.*}"
          git fetch --no-tags https://github.com/clash-verge-rev/clash-verge-rev.git "refs/tags/${BASE}:refs/tags/${BASE}"
          CORE="$(curl -fsSL https://github.com/SomeoneKong/mihomo/releases/latest/download/version.txt)"
          {
            echo "Based on upstream [${BASE}](https://github.com/clash-verge-rev/clash-verge-rev/releases/tag/${BASE}), bundling mihomo [${CORE}](https://github.com/SomeoneKong/mihomo/releases/tag/${CORE})."
            echo
            echo "Patches:"
            git log --reverse --format='- %s' "${BASE}..${GITHUB_SHA}"
            echo
            echo "The macOS build is ad-hoc signed. Before its first launch, run:"
            echo
            echo '```'
            echo 'xattr -dr com.apple.quarantine "/Applications/Clash Verge.app"'
            echo '```'
            echo
            echo "On Ubuntu 22.04, Debian 12 or later, install or upgrade to the latest release with:"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-linux.sh | bash"
            echo '```'
          } > release.md
          cat release.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      # GitHub turns the spaces in asset names into dots; rename first so the
      # checksums match the published names.
      - name: Collect assets
        run: |
          mkdir assets
          find artifacts -type f | while IFS= read -r f; do
            mv "$f" "assets/$(basename "$f" | tr ' ' '.')"
          done
          cp scripts/fork-install-linux.sh assets/install-linux.sh
          cd assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --verify-tag \
            --title "Clash Verge Rev ${GITHUB_REF_NAME}" \
            --notes-file release.md
