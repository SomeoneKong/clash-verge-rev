[package]
name = "clash-verge-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0"

[lib]
name = "clash_verge_updater"
path = "src/lib.rs"

[[bin]]
name = "clash-verge-updater"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = "0.23.1"
chrono = { workspace = true }
minisign-verify = "0.3.0"
semver = "1.0.28"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.11.1"
tokio = { workspace = true, features = ["io-util", "net", "rt", "rt-multi-thread", "time", "sync", "macros", "signal"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_IO",
] }

[lints]
workspace = true
